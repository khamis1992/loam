# Build a self-updating installer and publish the update feed.
#
# On every tag push it builds the NSIS installer and uploads `latest.yml` +
# the installer to a GitHub Release. Point the app's updateFeedUrl at either:
#   * a public repo:  https://github.com/<owner>/<repo>/releases/latest/download/
#   * your own host:  mirror the same files behind your feed URL
#
# Requires repo secrets for code signing if you enable it (CSC_LINK/CSC_KEY_PASSWORD).

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build-win:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run verify:web
      - run: npm run build:server

      - name: Build and smoke-test installer
        run: npm run dist && npm run check:installer
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}

      - name: Publish update feed to the release
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          gh release create $tag --title $tag --notes "Automated release $tag" --repo "${{ github.repository }}" 2>$null
          Get-ChildItem release -File | Where-Object { $_.Name -match '\.(exe|yml|blockmap)$' } | ForEach-Object {
            gh release upload $tag $_.FullName --clobber --repo "${{ github.repository }}"
          }
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
