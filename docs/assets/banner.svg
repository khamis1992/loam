<svg width="1200" height="200" viewBox="0 0 1200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f8f9fa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e9ecef;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="200" fill="url(#bgGradient)"/>
  
  <!-- Logo mark (dark rounded square) -->
  <rect x="440" y="60" width="80" height="80" rx="16" fill="#2b2d30"/>
  
  <!-- Inner logo design -->
  <circle cx="480" cy="100" r="20" fill="#ffffff" opacity="0.3"/>
  <rect x="470" y="90" width="20" height="20" rx="4" fill="#ffffff"/>
  
  <!-- Wordmark -->
  <text x="540" y="120" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="48" font-weight="700" fill="#2b2d30">loam</text>
  <text x="680" y="120" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="48" font-weight="300" fill="#6c757d">studio</text>
  
  <!-- Tagline -->
  <text x="540" y="145" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="400" fill="#6c757d">Local AI Agent Workspace</text>
</svg>
