<!doctype html>
<html lang="ar">
<head>
  <meta charset="utf-8" />
  <style>
    html, body { margin: 0; background: transparent; font-family: "Segoe UI", sans-serif; }
    .card {
      margin: 16px;
      border-radius: 16px;
      background: rgba(20, 20, 20, 0.92);
      color: #fff;
      text-align: center;
      padding: 16px 12px;
    }
    strong { display: block; font-size: 40px; line-height: 1; }
    span { display: block; margin-top: 6px; font-size: 14px; }
  </style>
</head>
<body>
  <div class="card">
    <strong id="count">3</strong>
    <span>مسجّل Loam</span>
  </div>
  <script>
    const params = new URLSearchParams(location.search);
    let left = Math.max(1, Math.min(10, Number(params.get("seconds")) || 3));
    const node = document.getElementById("count");
    node.textContent = String(left);
    setInterval(() => {
      left = Math.max(0, left - 1);
      node.textContent = String(left);
    }, 1000);
  </script>
</body>
</html>
