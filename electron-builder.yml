# electron-builder config for Loam.
# Strips ~90 MB of redundant bundled packages (@napi-rs, pdfjs-dist, pdf-parse),
# source maps, TS declarations, and non-x64-Windows prebuilds while keeping
# runtime node_modules unified so Node subpath exports (e.g. zod/v3) work reliably.

appId: app.loam.desktop
productName: Loam
directories:
  output: release
files:
  - electron/**/*
  - dist/**/*
  - ui/**/*
  # Next.js static export served by the app:// protocol (main window renderer).
  - packages/web/out/**/*
  - skills/**/*
  - agents/**/*
  - evals/**/*
  - addons/**/*
  - scripts/**/*
  # Neo N22: the bilingual user guide served by /api/docs and the in-app help
  # page. It is authored Markdown read from disk, so it must ship in the asar.
  - docs/neo/**/*
  - config.json
  - package.json
  # Already bundled inside dist/server.cjs (+ dist/pdf.worker.mjs):
  - "!node_modules/@napi-rs/**/*"
  - "!node_modules/pdfjs-dist/**/*"
  - "!node_modules/pdf-parse/**/*"
  # Strip source maps, TS declarations, and non-x64-Windows prebuilds:
  - "!node_modules/**/*.map"
  - "!node_modules/**/*.d.ts"
  - "!node_modules/**/prebuilds/darwin-*/**/*"
  - "!node_modules/**/prebuilds/linux-*/**/*"
  - "!node_modules/**/prebuilds/win32-arm64/**/*"
  - "!node_modules/**/win10-arm64/**/*"
asar: true
# Only files that must be real on disk are unpacked: native addons and the
# helper binaries/DLLs they load (node-pty conpty/winpty, sharp libvips).
# The server and MCP bridge run from inside app.asar via utilityProcess.fork.
asarUnpack:
  - "**/*.node"
  - "**/node_modules/node-pty/**/*"
  - "**/node_modules/@img/**/*"
  - "**/node_modules/sharp/**/*"
afterPack: ./electron/afterPack.cjs
# electron-builder's dependency collector excludes directories named examples.
# Three.js ships its runtime controls/loaders/exporters in examples/jsm.
extraResources:
  - from: node_modules/ffmpeg-static
    to: app.asar.unpacked/node_modules/ffmpeg-static
    filter:
      - "ffmpeg.exe*"
      - "LICENSE"
  - from: node_modules/three/examples/jsm
    to: app.asar.unpacked/node_modules/three/examples/jsm
    filter:
      - "**/*.js"
  - from: resources/legal/ocr
    to: app.asar.unpacked/resources/legal/ocr
  - from: node_modules/tesseract.js
    to: app.asar.unpacked/node_modules/tesseract.js
  - from: node_modules/tesseract.js-core
    to: app.asar.unpacked/node_modules/tesseract.js-core
  - from: node_modules/pdfjs-dist
    to: app.asar.unpacked/node_modules/pdfjs-dist
  - from: node_modules/@napi-rs/canvas
    to: app.asar.unpacked/node_modules/@napi-rs/canvas
npmRebuild: false

# Update feed (generic): overridable at runtime via MANUS_LOCAL_UPDATE_URL,
# MANUS_GITHUB_REPO, or POST /api/updater (settings.json updateFeedUrl / githubRepo).
publish:
  provider: generic
  url: "http://127.0.0.1:8788/"

win:
  icon: electron/assets/loam.ico
  target:
    - nsis

nsis:
  oneClick: true
  perMachine: false
  deleteAppDataOnUninstall: false
  artifactName: "Loam-Setup-${version}.${ext}"
