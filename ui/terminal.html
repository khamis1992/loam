<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="/theme.js"></script>
    <title>Loam — الطرفية</title>
    <link rel="icon" href="/assets/loam-symbol.svg">
    <link rel="stylesheet" href="/vendor/xterm.css" />
    <link rel="stylesheet" href="/styles.css" />
    <style>
      body { height: 100vh; display: flex; flex-direction: column; }
      #bar {
        display: flex;
        gap: 10px;
        align-items: center;
        padding: 8px 12px;
        background: var(--panel);
        border-bottom: 1px solid var(--border);
      }
      #term { flex: 1; padding: 6px; background: var(--stage); min-height: 0; }
      .status { font-size: 12px; color: var(--muted); }
      a.back { color: var(--accent); text-decoration: none; font-size: 13px; }
      body[data-embedded] #bar{direction:ltr;padding:4px 8px;gap:6px;min-height:36px;flex-wrap:nowrap;overflow:hidden}
      body[data-embedded] a.back{display:none}
      body[data-embedded] #bar label{display:flex;align-items:center;gap:5px;white-space:nowrap;font-size:10px;flex-shrink:0}
      body[data-embedded] #bar select,body[data-embedded] #bar button{margin:0;padding:3px 7px;min-height:27px;width:auto;font-size:10px;white-space:nowrap}
      body[data-embedded] #bar .status{font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-inline-start:auto;min-width:0}
      body[data-embedded] #term{padding:3px}
    </style>
    <link rel="stylesheet" href="/loam.css" />
  <link rel="stylesheet" href="/icons.css"><script type="module" src="/icons.js"></script></head>
  <body class="loam-secondary">
    <div id="bar">
      <a class="back" href="/"><loam-icon name="back"></loam-icon> مساحة Loam</a>
      <label>الشل
        <select id="shell">
          <option value="powershell">powershell</option>
          <option value="cmd">cmd</option>
        </select>
      </label>
      <button id="start">تشغيل جلسة</button>
      <button id="kill" class="ghost">إيقاف</button>
      <span class="status" id="status"></span>
    </div>
    <div id="term"></div>
    <script src="/vendor/xterm.js"></script>
    <script src="/vendor/addon-fit.js"></script>
    <script src="/terminal.js"></script>
  </body>
</html>
