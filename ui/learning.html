<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="/theme.js"></script>
    <title>Loam — التعلّم الذاتي</title>
    <link rel="icon" href="/assets/loam-symbol.svg">
    <link rel="stylesheet" href="/styles.css" />
    <style>
      body { padding: 0; display: block; height: auto; background: var(--bg); }
      .page { max-width: 1080px; margin: 0 auto; padding: 18px 22px 60px; }
      .page-head {
        position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 10px;
        padding: 12px 22px; border-bottom: 1px solid var(--border);
        background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(10px);
      }
      .page-head h2 { margin: 0; font-size: 17px; }
      a.back {
        display: inline-flex; align-items: center; gap: 6px; padding: 6px 11px;
        border: 1px solid var(--border); border-radius: 10px; background: var(--panel-2);
        color: var(--text); text-decoration: none; font-size: 13px;
      }
      a.back:hover { border-color: var(--accent); background: var(--panel-3); }

      h3 {
        display: flex; align-items: center; gap: 8px; margin: 22px 0 10px;
        font-size: 13.5px; color: var(--text); font-weight: 700;
      }
      h3::before { content: ""; width: 4px; height: 15px; border-radius: 3px; background: var(--accent); }
      h3 .muted, h3 span.muted { font-weight: 400; font-size: 12px; }

      .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
      #pending, #evalRuns, #log { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 12px; }

      .card {
        position: relative; border: 1px solid var(--border); border-radius: var(--r);
        background: var(--panel); padding: 14px 14px 14px 18px; margin: 0;
        transition: transform .16s ease, border-color .16s ease, box-shadow .16s ease;
      }
      .card:hover { transform: translateY(-1px); box-shadow: var(--shadow); border-color: color-mix(in srgb, var(--accent) 32%, var(--border)); }
      .card::before { content: ""; position: absolute; inset-inline-start: 0; top: 12px; bottom: 12px; width: 3px; border-radius: 3px; background: var(--accent); opacity: .55; }
      .card .meta { font-size: 11.5px; color: var(--muted); margin-bottom: 6px; direction: ltr; text-align: left; }
      .card > div:not(.meta) { font-size: 13px; line-height: 1.7; }
      .kind {
        display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 10.5px;
        background: color-mix(in srgb, var(--accent) 14%, transparent); color: var(--accent); font-weight: 600;
      }
      pre.body {
        white-space: pre-wrap; word-break: break-word; font-size: 12px; margin: 8px 0 0; max-height: 220px; overflow: auto;
        background: var(--panel-2); border: 1px solid var(--border); border-radius: 9px; padding: 9px 10px;
        direction: ltr; text-align: left;
      }
      .btns { display: flex; gap: 8px; margin-top: 10px; }
      .btns button { padding: 6px 13px; font-size: 12.5px; border-radius: 9px; }

      .muted { color: var(--muted); }
      select { background: var(--panel); color: inherit; border: 1px solid var(--border); border-radius: 10px; padding: 8px 10px; }
      .chip { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 11px; margin: 2px 0; border: 1px solid transparent; }
      .chip.pass { background: color-mix(in srgb, var(--ok) 16%, transparent); color: var(--ok); border-color: color-mix(in srgb, var(--ok) 35%, transparent); }
      .chip.fail { background: color-mix(in srgb, var(--err) 16%, transparent); color: var(--err); border-color: color-mix(in srgb, var(--err) 35%, transparent); }
      .chip.error { background: color-mix(in srgb, var(--warn) 18%, transparent); color: var(--warn); border-color: color-mix(in srgb, var(--warn) 38%, transparent); }
      .chip.skipped { background: var(--panel-3); color: var(--muted); border-color: var(--border); }
      details { margin-top: 8px; border-top: 1px solid var(--border); padding-top: 8px; }
      details summary { cursor: pointer; font-size: 12.5px; color: var(--muted); }
      details summary:hover { color: var(--text); }
      #evalInfo { font-size: 12.5px; }
    </style>
    <link rel="stylesheet" href="/loam.css" />
  <link rel="stylesheet" href="/icons.css"><script type="module" src="/icons.js"></script></head>
  <body class="loam-secondary">
    <div class="page-head">
      <a class="back" href="/"><loam-icon name="back"></loam-icon> مساحة Loam</a>
      <h2>حلقة التعلّم الذاتي</h2>
    </div>
    <div class="page">
    <h3>بانتظار الموافقة (<span id="pendCount">0</span>)</h3>
    <div class="row">
      <button id="approveAll" class="primary">موافقة على الكل</button>
      <button id="rejectAll" class="ghost">رفض الكل</button>
    </div>
    <div id="pending"></div>

    <h3>التقييم الذاتي</h3>
    <div class="row">
      <select id="evalSuite"></select>
      <button id="evalRun" class="primary">تشغيل التقييم</button>
      <button id="evalSelfplay" class="ghost">توليد حالات من الفشل</button>
      <button id="evalExport" class="ghost">تصدير بيانات التدريب</button>
    </div>
    <div id="evalInfo" class="muted" style="margin-bottom: 8px"></div>
    <div id="evalRuns"></div>

    <h3>سجل التعلّم <span id="memInfo" class="muted"></span></h3>
    <div class="row">
      <button id="curate" class="ghost">تنقيح الذاكرة</button>
      <span id="curateInfo" class="muted"></span>
    </div>
    <div id="log"></div>
    </div>

    <script src="/learning.js"></script>
  </body>
</html>
