apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: loam-default-deny
  namespace: loam-security
spec:
  podSelector: {}
  policyTypes: ["Ingress", "Egress"]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: loam-control-plane-access
  namespace: loam-security
spec:
  podSelector:
    matchLabels:
      app: loam-control-plane
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - port: 3939
  egress:
    - to:
        - namespaceSelector: {}
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - ports:
        - port: 443
