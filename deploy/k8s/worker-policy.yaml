apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: loam-worker-egress
  namespace: loam-security
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values: [loam-android-worker, loam-ios-worker]
  policyTypes: ["Egress"]
  egress:
    - to:
        - namespaceSelector: {}
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - ports:
        - port: 443
